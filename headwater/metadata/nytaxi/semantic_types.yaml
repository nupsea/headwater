version: 1
patterns:
  - semantic_type: dimension
    pattern: ".*name$|.*_name$|.*_type($|_\\d+$)|.*type$|.*category.*|.*status.*"
    confidence: 0.7
  - semantic_type: dimension
    pattern: ".*_code$|.*code$|.*flag$|.*indicator$|.*number$|.*_num$|.*_no$"
    confidence: 0.7
  - semantic_type: temporal
    pattern: "^year$|^month$|.*date.*|.*_at$|.*timestamp.*"
    confidence: 0.85
  - semantic_type: metric
    pattern: ".*_count$|^count$|.*score.*|.*_rate$|^rate$|.*pct_.*|.*_value$|^value$|.*_measure$|.*measure_.*"
    confidence: 0.85
  - semantic_type: metric
    pattern: ".*_days$|^days_.*|.*percentile.*|.*median.*|.*_total$|^total_.*|.*_avg$|.*_average$|.*_max$|.*_min$|^max_.*|^min_.*|.*_sum$|^sum_.*"
    confidence: 0.85
  - semantic_type: text
    pattern: ".*description.*|.*narrative.*|.*notes.*"
    confidence: 0.7
  - semantic_type: dimension
    pattern: "^borough$|^zone$|.*_zone$|.*_location$|.*locationid$"
    confidence: 0.8
  - semantic_type: dimension
    pattern: ".*payment.*|.*vendor.*|.*ratecode.*|.*store_and_fwd.*"
    confidence: 0.75
  - semantic_type: metric
    pattern: ".*amount.*|.*fare.*|.*tip.*|.*toll.*|.*surcharge.*|.*tax.*"
    confidence: 0.85
  - semantic_type: metric
    pattern: ".*distance.*|.*miles.*|.*duration.*|.*elapsed.*|.*trip_time.*"
    confidence: 0.85
  - semantic_type: metric
    pattern: ".*passenger_count.*"
    confidence: 0.85
