[project]
name = "headwater"
version = "0.1.0"
description = "Advisory data platform for data professionals"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "duckdb>=1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "cryptography>=45.0.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "typer>=0.12",
    "anthropic>=0.40",
    "jinja2>=3.1",
    "rich>=13.0",
    "pyyaml>=6.0",
    "pyarrow>=23.0.1",
    "scipy>=1.17.1",
    "psycopg2-binary>=2.9.11",
    "lancedb>=0.30.2",
    "sentence-transformers>=5.4.0",
    "kuzu>=0.11.3",
    "snowflake-connector-python[secure-local-storage]>=4.5.0",
]

[project.scripts]
headwater = "headwater.cli.main:app"
hw2 = "headwater.cli.hw2:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pyright>=1.1.409",
    "pytest>=8.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.5",
]
